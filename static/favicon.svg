<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Database Cylinder Stack -->
  <!-- Top Disk -->
  <ellipse cx="30" cy="19" rx="17" ry="6.5" fill="url(#cyanPurple)" filter="url(#glow)" opacity="0.95"/>
  <ellipse cx="30" cy="19" rx="14" ry="4.5" fill="#090d16" fill-opacity="0.7"/>

  <!-- Middle Cylinder Layer -->
  <path d="M13 25 C13 30.5 47 30.5 47 25 L47 32 C47 37.5 13 37.5 13 32 Z" fill="url(#cyanPurple)" opacity="0.8"/>
  <ellipse cx="30" cy="32" rx="17" ry="6.5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Bottom Cylinder Layer -->
  <path d="M13 38 C13 43.5 47 43.5 47 38 L47 44 C47 50 13 50 13 44 Z" fill="url(#cyanPurple)" opacity="0.9"/>
  <ellipse cx="30" cy="44" rx="17" ry="6.5" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- AI / Neural Query Sparkle in foreground right -->
  <path d="M48 10 L50.5 17 L57.5 19.5 L50.5 22 L48 29 L45.5 22 L38.5 19.5 L45.5 17 Z" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M48 12 L49.8 17.5 L55.5 19.5 L49.8 21.5 L48 27 L46.2 21.5 L40.5 19.5 L46.2 17.5 Z" fill="#ffffff"/>
  
  <!-- Tiny Secondary Sparkle -->
  <path d="M20 45 L21.5 49 L25.5 50.5 L21.5 52 L20 56 L18.5 52 L14.5 50.5 L18.5 49 Z" fill="#a855f7" opacity="0.85"/>
</svg>
