services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI / AMYPO Backend Application (Tuned Memory & glibc Arenas)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amypo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Relational PostgreSQL Database Connection (resolved via internal DNS 'postgres')
      - DATABASE_URL=postgresql://amypo_user:amypo_secure_password_2026@postgres:5432/amypo_db
      # Internal Docker DNS service resolution (service names, NOT hardcoded IPs)
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_SERVER_URL=http://chromadb:8000
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_COLLECTION=local_qa_collection
      - DEFAULT_OLLAMA_MODEL=qwen2.5-coder:latest
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - PORT=5000
      # Lean worker thread allocation: 4 threads prevent glibc thread arena sprawl
      - WAITRESS_THREADS=4
      - APP_SECRET_KEY=amypo-production-secret-key-change-in-env
    # -------------------------------------------------------------------------
    # SECURITY LOCKDOWN: Only the FastAPI application gateway binds to the host.
    # All database and vector services (Postgres, ChromaDB) are strictly unmapped,
    # preventing external actors from bypassing the RBAC and data isolation layers.
    # -------------------------------------------------------------------------
    ports:
      - "${HOST_PORT:-5000}:5000"
    networks:
      internal_network:
        aliases:
          - fastapi
          - backend
    volumes:
      - documents_data:/app/documents
    # Explicit container resource boundaries (prevents memory starvation)
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. Dedicated PostgreSQL Relational Database Service (Tuned Buffer Pools)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: amypo_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=40
      -c effective_cache_size=128MB
    environment:
      - POSTGRES_USER=amypo_user
      - POSTGRES_PASSWORD=amypo_secure_password_2026
      - POSTGRES_DB=amypo_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "5432"
    networks:
      internal_network:
        aliases:
          - postgres
          - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amypo_user -d amypo_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. Dedicated ChromaDB Vector Server (Bounded Segment Caches)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: amypo_chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SEGMENT_CACHE_POLICY=LRU
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "8000"
    networks:
      internal_network:
        aliases:
          - chromadb
    volumes:
      - chroma_data:/chroma/chroma
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4. Local Ollama LLM Inference Server (GPU Accelerated & Memory Capped)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: amypo_ollama
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Memory Optimization: Limit parallel streams and unload idle models after 5m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "11434"
    networks:
      internal_network:
        aliases:
          - ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6144M
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

# ---------------------------------------------------------------------------
# Internal Docker Bridge Network for Safe Service Isolation
# ---------------------------------------------------------------------------
networks:
  internal_network:
    name: amypo_internal_bridge
    driver: bridge

# ---------------------------------------------------------------------------
# Explicit Named Docker Volumes (No Host Paths)
# Embeddings, relational database, LLM weights, and documents persist across teardowns
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: amypo_postgres_data
  chroma_data:
    name: amypo_chroma_data
  ollama_data:
    name: amypo_ollama_data
  documents_data:
    name: amypo_documents_data
