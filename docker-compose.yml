version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI / AMYPO Backend Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amypo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Relational PostgreSQL Database Connection
      - DATABASE_URL=postgresql://amypo_user:amypo_secure_password_2026@postgres:5432/amypo_db
      # Internal Docker DNS service resolution
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_COLLECTION=local_qa_collection
      - DEFAULT_OLLAMA_MODEL=qwen2.5-coder:latest
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - PORT=5000
      - WAITRESS_THREADS=16
      - APP_SECRET_KEY=amypo-production-secret-key-change-in-env
    # Only the application gateway exposes its port to the host / public internet
    ports:
      - "5000:5000"
    networks:
      internal_network:
        aliases:
          - fastapi
          - backend
    volumes:
      - documents_data:/app/documents
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. Dedicated PostgreSQL Relational Database Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: amypo_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=amypo_user
      - POSTGRES_PASSWORD=amypo_secure_password_2026
      - POSTGRES_DB=amypo_db
      - PGDATA=/var/lib/postgresql/data/pgdata
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "5432"
    networks:
      internal_network:
        aliases:
          - postgres
          - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amypo_user -d amypo_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. Dedicated ChromaDB Vector Server (Client/Server Mode)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: amypo_chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "8000"
    networks:
      internal_network:
        aliases:
          - chromadb
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4. Local Ollama LLM Inference Server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: amypo_ollama
    restart: unless-stopped
    # Internal port exposure ONLY: No host port binding prevents external internet access
    expose:
      - "11434"
    networks:
      internal_network:
        aliases:
          - ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

# ---------------------------------------------------------------------------
# Internal Docker Bridge Network for Safe Service Isolation
# ---------------------------------------------------------------------------
networks:
  internal_network:
    name: amypo_internal_bridge
    driver: bridge

# ---------------------------------------------------------------------------
# Explicit Named Docker Volumes (No Host Paths)
# Embeddings, relational database, LLM weights, and documents persist across teardowns
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: amypo_postgres_data
  chroma_data:
    name: amypo_chroma_data
  ollama_data:
    name: amypo_ollama_data
  documents_data:
    name: amypo_documents_data
