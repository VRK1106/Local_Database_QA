version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Persistent Relational Database (PostgreSQL)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: amypo_postgres
    restart: always
    environment:
      POSTGRES_DB: amypo_db
      POSTGRES_USER: amypo_user
      POSTGRES_PASSWORD: amypo_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amypo_user -d amypo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Dedicated ChromaDB Vector Server (Client/Server Mode)
  # -------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: amypo_chromadb
    restart: always
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: "/chroma/chroma"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. AMYPO Application Service (Decoupled & Stateless)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amypo_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      # Relational persistence via dedicated PostgreSQL
      DATABASE_URL: "postgresql://amypo_user:amypo_secure_password_2026@postgres:5432/amypo_db"
      # Vector persistence via dedicated ChromaDB server
      CHROMA_SERVER_HOST: "chromadb"
      CHROMA_SERVER_HTTP_PORT: "8000"
      CHROMA_COLLECTION: "local_qa_collection"
      # Local Ollama connection from host machine or container network
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      APP_SECRET_KEY: "amypo-production-secret-key-replace-in-env"
      PORT: "5000"
      WAITRESS_THREADS: "16"
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount shared persistent documents repository
      - documents_data:/app/documents
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

# -------------------------------------------------------------
# Persistent Volumes (Preserved across container redeployments)
# -------------------------------------------------------------
volumes:
  postgres_data:
    name: amypo_postgres_data
  chroma_data:
    name: amypo_chroma_data
  documents_data:
    name: amypo_documents_data
